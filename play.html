.btn{display:block;width:100%;margin-top:14px;background:var(--red);border:none;border-radius:6px;padding:12px;font-weight:700;font-size:17px;color:#fff;box-shadow:0 4px 0 var(--redS)}
.btn:active{transform:translateY(3px);box-shadow:none}

.hero{text-align:center;padding-top:8px}
.hero .kick{font-size:13px;color:var(--muted);letter-spacing:.3em}

.box h3{margin:0 0 6px;font-size:16px;color:var(--gold)}

.swot .s b{color:#8fd6b7}.swot .w b{color:#f08c80}.swot .o b{color:#e0b04a}.swot .t b{color:#b9a6e8}
.tree{margin-top:8px;font-size:13px}

.tree .ln{width:52px;color:var(--muted)}
.node{padding:1px 8px;border-radius:12px;border:1.5px solid var(--line);color:#6f6680;background:#1a1722}

.alt{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;margin-top:6px;font-size:14px}

.alt .hd{font-weight:700;margin-bottom:2px}
.alt .badge{font-size:11.5px;padding:0 6px;border-radius:3px;margin-left:4px;background:var(--gold);color:#1d1a26}
.alt .fit{font-size:11.5px;padding:0 6px;border-radius:3px;margin-left:4px;border:1px solid}

.ana{margin-top:8px;font-size:14px;background:#14111b;border-left:3px solid var(--gold);padding:6px 10px;border-radius:0 6px 6px 0}
.rev{margin-top:6px;font-size:13.5px;color:#d9c7a1;background:#2a221a;border-radius:6px;padding:6px 10px}
.gl{border-bottom:1.5px dotted var(--gold);cursor:help}

間，你怎麼做？", "options": [{"type": 0, "label": "帶家人到山裡避難", "result": "你帶著家人躲進山裡。全家平安，但茶園沒人照顧，收成損失不少。", "effects": {"family": 2, "wealth": -1}}, {"type": 1, "label": "把茶葉存起來，等封鎖解除", "result": "你把茶葉存在倉庫裡。封鎖拖了好幾個月，一部分茶葉受潮發霉，損失慘重。", "effects": {"wealth": -2}, "fit": -1}, {"type": 2, "label": "加入團練，保衛淡水", "result": "你跟著團練在海邊挖壕溝、守陣地。法軍登陸淡水時被擊退，你成了鄉里口中的英雄，卻也在戰鬥中受了傷。", "effects": {"fame": 2, "family": -1}, "gain": ["人脈"]}], "card": {"decline": "封鎖期間：所有出口貿易停擺", "rise": "防務工事、軍需運輸", "learn": "戰爭讓清廷更重視臺灣，隔年臺灣建省"}, "ep": "第5集｜法軍來襲", "hook": "【系統警告】戰爭事件：清法戰爭！", "review": "法軍進攻淡水時被擊退；清法戰爭也讓清廷更重視臺灣，隔年臺灣建省。"}, {"year": 1886, "age": 36, "stage": "中年", "title": "建省與清賦", "book": "課本｜臺灣建省", "bg": "yamen", "music": "calm", "scene": ["1885 年臺灣建省，劉銘傳擔任第一任巡撫。為了籌錢建設，他開始重新丈量土地、整頓稅收，稱為「清賦」。", "很多人以前少報土地，現在要多繳稅了，地方上議論紛紛。"], "question": "你怎麼面對新的稅制？", "options": [{"type": 0, "label": "和鄉親一起抗議新稅", "result": "你和鄉親到衙門請願，抗議稅太重。官府最後減了一點，但你也被官府記上了名字。", "effects": {"fame": 1, "wealth": 1}, "fit": -1}, {"type": 1, "label": "想辦法少報一點，能省則省", "result": "你少報了一塊茶園。省下一點稅，但心裡總是不踏實，怕哪天被查到。", "effects": {"wealth": 1, "fame": -1}}, {"type": 2, "label": "照實申報，配合新制度", "result": "你照實申報，多繳了稅。但你的土地從此有了清楚的證明文件，向錢莊借錢也方便多了。", "effects": {"wealth": -1, "fame": 1, "adapt": 1}, "fit": 1}], "card": {"decline": "靠隱瞞土地少繳稅的做法", "rise": "地方建設：鐵路、電報、郵政", "learn": "新制度推行時，有人配合、有人反對"}, "ep": "第6集｜新巡撫要查稅了", "hook": "【系統】新規則上線：清賦。", "review": "劉銘傳的清賦增加了稅收、支持建設，但稅負加重也引起民間不滿。"}, {"year": 1888, "age": 38, "stage": "中年", "title": "鐵路與電報", "book": "課本｜臺灣的自強建設", "bg": "telegraph", "music": "calm", "scene": ["劉銘傳在臺灣架設電報、開辦郵政，也開始修築鐵路，還在臺北設立「西學堂」，教英文、法文和算學。", "電報局和鐵路局都在招人，你的兒子也到了讀書的年紀。"], "question": "面對這些新建設，你怎麼做？", "options": [{"type": 0, "label": "專心照顧茶園和生意", "result": "你專心做茶。新建設跟你關係不大，日子照常過。", "effects": {"family": 1}}, {"type": 1, "label": "送兒子進西學堂", "result": "兒子進了西學堂，學英文和算學。他回家教你看電報上的英文字母。", "effects": {"adapt": 1}, "flags": ["kid_school"]}, {"type": 2, "label": "自己應聘電報局或鐵路局", "branches": [{"if": ["外語", "算學"], "result": "你會外語，被電報局錄用，負責和洋人往來的電報。茶園交給家人照顧，你成了新式機構的一員。", "effects": {"wealth": 2, "fame": 1, "adapt": 1}, "gain": ["機械"], "role": "電報局職員", "fit": 1}, {"result": "你沒有外語和算學的底子，只能在鐵路工地做監工。工作辛苦，但你學到了不少新知識。", "effects": {"wealth": 1, "family": -1, "adapt": 1}, "gain": ["機械"], "role": "鐵路監工"}]}], "card": {"decline": "靠人力、帆船的傳統運輸與傳信", "rise": "電報員、鐵路工人、郵政人員", "learn": "西學堂（1887）：臺灣第一所教西方學問的官辦學堂"}, "ep": "第7集｜火車、電報來到臺灣", "hook": "【系統】科技升級：鐵路、電報、郵政。", "review": "劉銘傳時期的建設，讓臺灣成為當時中國最先進的省分之一。"}, {"year": 1890, "age": 40, "stage": "中年", "title": "錫蘭茶的挑戰", "book": "延伸｜國際茶葉競爭", "bg": "teahill", "music": "tense", "scene": ["英國人在錫蘭、印度大規模種茶，用機器製茶，價錢便宜，搶走了不少歐美市場。", "臺灣茶商得想辦法：要繼續做烏龍茶、改做包種茶，還是乾脆改做正在漲價的樟腦？"], "question": "你的茶業要往哪裡走？", "options": [{"type": 0, "label": "繼續擴大烏龍茶", "result": "你照舊擴大烏龍茶。美國還是有人喜歡，但價錢一年不如一年。", "effects": {"wealth": -1}, "fit": -1}, {"type": 1, "label": "改做樟腦生意", "result": "樟腦價格高漲，你轉做樟腦買賣，賺了一筆。但樟樹多在山區，常和原住民發生衝突，風險很大。", "effects": {"wealth": 2, "family": -1}, "role": "樟腦商"}, {"type": 2, "label": "轉做包種茶，開拓南洋市場", "branches": [{"if": ["pouchong", "製茶"], "result": "你早就熟悉包種茶，這回在臺北設廠直接加工，銷往南洋，生意越做越大。", "effects": {"wealth": 2, "fame": 1}, "role": "包種茶商", "fit": 1}, {"result": "你從頭學做包種茶，請來福建的茶師幫忙。第一年品質不穩，第二年才慢慢打開南洋市場。", "effects": {"wealth": 1, "adapt": 1}, "gain": ["製茶"], "role": "包種茶商", "fit": 1}]}], "card": {"decline": "北臺灣烏龍茶的歐美市場：被錫蘭、印度茶搶走", "rise": "包種茶、樟腦", "learn": "了解國際市場，才知道下一步該往哪裡走", "note": "1895 年臺灣割讓給日本——那是下一章的故事。"}, "ep": "第8集｜錫蘭茶來搶市場", "hook": "【系統警告】全球競爭來襲！", "review": "錫蘭、印度紅茶崛起後，臺灣改發展包種茶和樟腦，北臺灣經濟持續發展。"}], "swot": {"S": "年輕，家住港口附近，家裡有點小生意", "W": "不懂外語，也沒有本錢", "O": "淡水開港，北部山坡很適合種茶", "T": "國際市場競爭，還有戰爭封鎖港口"}}]}</script>

  if(badShift>=1 && (dW<=-2 || s.family<=3 || (fit<3 && dW<=-1))) type='轉型受挫';

}

function wrap(g,text,x,y,w,lh){ var line=''; for(var ch of text){ if(g.measureText(line+ch).width>w){ g.fillText(line,x,y); y+=lh; line=ch; } else line+=ch; } if(line) g.fillText(line,x,y); return y+lh; }
async function saveImage(R,btn){
  var cv=renderCardCanvas(R), url=cv.toDataURL('image/png'), box=document.getElementById('imgbox');
  var fname='生涯回顧卡_'+(st.name||role().short)+'.png';
  try{
    var dl=window.claude&&await Promise.race([window.claude.use('downloads'),new Promise(function(r){ setTimeout(function(){ r(null); },1500); })]);
    if(dl){ var blob=await (await fetch(url)).blob(); await dl.save({filename:fname,data:blob}); btn.textContent='已下載圖片 ✓'; return; }
  }catch(e){}
  box.innerHTML='<p class="small" style="margin:8px 0 0">手機請長按圖片儲存；電腦請按右鍵「另存圖片」。</p><img class="shot" alt="生涯回顧卡" src="'+url+'">';
  btn.textContent='圖片已產生 ↓';
}
function renderCardCanvas(R){
  var r=role(), W=720, logs=st.log, H=900+logs.length*30, cv=document.createElement('canvas'), g=cv.getContext('2d');
  cv.width=W; cv.height=H; g.imageSmoothingEnabled=false;
  g.fillStyle='#1d1a26'; g.fillRect(0,0,W,H); g.fillStyle='#0e0c14'; g.fillRect(20,20,W-40,170);
  g.textAlign='center'; g.fillStyle='#a99f8c'; g.font='16px sans-serif'; g.fillText('生涯回顧卡｜'+D.meta.title,W/2,56);
  g.fillStyle='#e0b04a'; g.font='bold 44px sans-serif'; g.fillText(R.type,W/2,112);
  g.fillStyle='#f3e9d2'; g.font='bold 22px sans-serif'; g.fillText(r.name+' → '+st.roles[st.roles.length-1],W/2,148);
  g.fillStyle='#a99f8c'; g.font='16px sans-serif'; g.fillText((st.name?st.name+(st.seat?'（'+st.seat+'）':'')+'｜':'')+r.born,W/2,176);
  var tls=timeline(), x0=W/2-(tls.length*150-30)/2;
  tls.forEach(function(f,i){ g.drawImage(portrait(f.look),x0+i*150,210,120,150); g.fillStyle='#a99f8c'; g.font='15px sans-serif'; g.fillText(f.label,x0+i*150+60,384); });
  g.textAlign='left'; var y=424;
  g.fillStyle='#f3e9d2'; g.font='17px sans-serif'; y=wrap(g,R.text,40,y,W-80,26)+16;
  g.fillStyle='#e0b04a'; g.font='bold 18px sans-serif'; g.fillText('職業軌跡',40,y); y+=28; g.fillStyle='#f3e9d2'; g.font='16px sans-serif'; y=wrap(g,st.roles.join(' → '),40,y,W-80,24)+8;
  g.fillStyle='#e0b04a'; g.font='bold 18px sans-serif'; g.fillText('學到的技能',40,y); y+=28; g.fillStyle='#f3e9d2'; g.font='16px sans-serif'; y=wrap(g,st.skills.join('、'),40,y,W-80,24)+8;
  g.fillStyle='#e0b04a'; g.font='bold 18px sans-serif'; g.fillText('最終數值',40,y); y+=14;
  SK.forEach(function(k,i){ var bx=40+(i%2)*330, by=y+Math.floor(i/2)*30; g.fillStyle='#f3e9d2'; g.font='16px sans-serif'; g.fillText(D.stats[k]+' '+st.stats[k],bx,by+16);
    for(var c=0;c<10;c++){ g.fillStyle=c<st.stats[k]?({wealth:'#e3b347',family:'#6fb59c',fame:'#c8463a',adapt:'#6b93c4'})[k]:'#3a3348'; g.fillRect(bx+90+c*20,by+4,17,12); } });
  y+=86; g.fillStyle='#e0b04a'; g.font='bold 18px sans-serif'; g.fillText('決定紀錄（堅守 '+R.cnt[0]+'・觀望 '+R.cnt[1]+'・轉型 '+R.cnt[2]+'）',40,y); y+=32;
  g.font='15px sans-serif'; logs.forEach(function(l){ g.fillStyle='#e0b04a'; g.fillText(String(l.year),40,y); g.fillStyle='#f3e9d2'; var t=l.title+'：'+l.choice; if(t.length>30) t=t.slice(0,29)+'…'; g.fillText(t,96,y); g.fillStyle='#a99f8c'; g.fillText(TYPE[l.type],W-80,y); y+=30; });
  var out=document.createElement('canvas'); out.width=W; out.height=y+16; out.getContext('2d').drawImage(cv,0,0); return out;
}

function render(){
  if(typing) typing.cancel();
  if(st.phase==='intro') renderIntro();
  else if(st.phase==='draw') renderDraw();
  else if(st.phase==='drawn'){ app.innerHTML=''; showRole(role()); }
  else if(st.phase==='end') renderEnd();
  else renderEvent();
}
st=fresh(); render();
window.__g={D:D, get st(){ return st; }, set:function(v){ st=v; }, begin:begin, choose:choose, next:next, computeEnding:computeEnding, skip:function(){ if(typing) typing.skip(); }, render:render, fresh:fresh};
})();
</script>
